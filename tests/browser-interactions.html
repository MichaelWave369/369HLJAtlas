<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Atlas browser interaction acceptance</title></head>
<body><h1>HLJ interaction acceptance (isolated local runner)</h1><p id="interaction-report" data-result="pending">Awaiting site boot</p>
<iframe id="site-frame" src="/" title="Atlas test frame" width="1080" height="900"></iframe>
<script>
"use strict";
const report=document.getElementById("interaction-report"),frame=document.getElementById("site-frame");
const fail=reason=>{report.dataset.result="failed";report.textContent="FAIL: "+reason;};
const pass=()=>{report.dataset.result="passed";report.textContent="PASS: Review workflow, source audit, research model and Institute navigation";};
const ensure=(condition,message)=>{if(!condition)throw Error(message);};
let finished=false,tries=0;
const check=setInterval(async()=>{
 if(finished)return;
 if(++tries>180){finished=true;clearInterval(check);fail("Timeout waiting for all site modules");return;}
 let d;
 try{d=frame.contentDocument;}catch{return;}
 if(!d||d.getElementById("verification-root")?.dataset.ready!=="true"||
   d.getElementById("source-audit-root")?.dataset.ready!=="true"||
   !d.querySelector("#living-protocols button[data-protocol='platonic-solids']")||
   !d.querySelector(".institute-map-node")||
   !d.querySelector("#realms button"))return;
 try{
  finished=true;clearInterval(check);

  const researchNav=d.querySelector('.site-nav details[data-group="research"]');
  ensure(!!researchNav,"Research dropdown missing");
  researchNav.querySelector("summary").click();
  ensure(researchNav.open,"Desktop Research dropdown did not open");
  ensure(!!researchNav.querySelector('a[href="#verification"]'),"Verification destination missing");
  researchNav.querySelector('a[href="#verification"]').click();
  ensure(!researchNav.open,"Desktop navigation did not close after link");
  frame.style.width="390px";
  ensure(d.defaultView.matchMedia("(max-width: 960px)").matches,"Mobile CSS breakpoint missing");
  const navToggle=d.getElementById("site-menu-toggle"),mobileNav=d.getElementById("site-nav");
  ensure(d.defaultView.getComputedStyle(navToggle).display!=="none","Mobile menu button hidden");
  ensure(d.defaultView.getComputedStyle(mobileNav).display==="none","Mobile menu initially expanded");
  navToggle.click();
  ensure(navToggle.getAttribute("aria-expanded")==="true","Mobile menu did not expand");
  ensure(d.defaultView.getComputedStyle(mobileNav).display!=="none","Expanded mobile nav not visible");
  const labs=d.querySelector('.site-nav details[data-group="labs"]');
  labs.querySelector("summary").click();
  ensure(labs.open,"Nested Labs menu did not expand");
  d.dispatchEvent(new d.defaultView.KeyboardEvent("keydown",{key:"Escape",bubbles:true}));
  ensure(navToggle.getAttribute("aria-expanded")==="false"&&!labs.open,"Escape did not close mobile menu");
  navToggle.click();
  d.querySelector('.site-nav a[href="#explore"]').click();
  ensure(navToggle.getAttribute("aria-expanded")==="false","Anchor click did not close mobile menu");
  frame.style.width="1080px";
  const q=d.querySelectorAll(".verification-card");
  ensure(q.length===10,"Claim queue did not load all ten entries");
  q[1].click();
  ensure(d.getElementById("verify-title").textContent.length>6,"Claim selection failed");
  ensure(d.getElementById("evidence-trail")?.dataset.ready==="true","Evidence Trail not initialized");
  ensure(d.getElementById("trail-claim-id").textContent==="claim-02","Evidence Trail did not follow selected claim");
  ensure(d.querySelectorAll("#trail-source-list .trail-source").length===2,"Expected both quartz claim sources");
  ensure(d.getElementById("trail-bib-count").textContent==="1","Quartz bibliography correction missing");
  ensure(d.getElementById("trail-permalink").href.includes("claim-02"),"Shareable claim URL absent");
  d.querySelector('#trail-source-list a[data-audit-source="nist-quartz"]').click();
  ensure(d.getElementById("source-audit-title").textContent.includes("Q to Ra"),"Source audit did not follow deep link");

  const notes=d.getElementById("verify-notes"),limits=d.getElementById("verify-limitations");
  notes.value="Source methods need a primary-text cross-check and independent replication review.";
  limits.value="A bibliographic match is not enough to verify the experimental result.";
  d.getElementById("verify-attestation").checked=true;
  d.getElementById("verify-capture").click();
  ensure(d.getElementById("verify-local").textContent==="1","Reviewer capture did not add proposal");
  d.getElementById("verify-clear").click();
  ensure(d.getElementById("verify-local").textContent==="0","Reviewer clear did not remove proposal");
  const filter=d.getElementById("source-audit-filter");
  filter.value="not-checked";filter.dispatchEvent(new Event("change",{bubbles:true}));
  const list=d.querySelectorAll("#source-audit-cards button");
  ensure(list.length===3,"Source audit unreviewed filter did not return three records");
  list[0].click();
  ensure(d.getElementById("source-audit-observation").textContent.includes("still require"),"Source detail did not update");
  d.querySelector("#living-protocols button[data-protocol='platonic-solids']").click();
  d.getElementById("living-prediction").value="Euler's invariant will equal two for this selected solid.";
  d.getElementById("living-run").click();
  ensure(d.getElementById("living-interpretation").hidden===false,"Platonic model did not execute");
  ensure(d.getElementById("living-outcome-body").textContent.includes("vertices"),"Model results not rendered");
  d.getElementById("living-observation").value="The resulting Euler count equals two.";
  d.getElementById("living-alternative").value="This combinatorial theorem does not establish any physical force.";
  d.getElementById("living-capture").click();
  ensure(d.querySelectorAll("#living-records .living-record").length===1,"Living Lab capture did not persist in session");

  // A local JSON upload must NOT become an accepted result without explicit consent.
  ensure(d.getElementById("packet-workbench")?.dataset.ready==="true","Research Workbench did not initialize");
  const reviewExample={schema:"369.hlj.review-packet.v1",createdAt:"2026-11-09T23:00:00Z",
    publicationState:"UNPUBLISHED_LOCAL_SUGGESTIONS",
    proposals:[{schema:"369.hlj.review-proposal.v1",claimId:"claim-02",topicId:"quartz-crystal-resonance",
      sourceId:"nist-quartz",assessment:"needs-more-evidence",createdAt:"2026-11-09T23:00:00Z",
      reviewNotes:"I examined a technical explanation of quartz oscillators and their properties.",
      limitations:"This has no evidence for any medical healing proposition.",
      correctionRequest:null,inspectionAcknowledged:true,status:"LOCAL_PROPOSAL_NOT_PUBLISHED",
      truthBoundary:"Self-reported source inspection, not authentication, peer review, scientific verification or an update to the public Atlas."}]};
  const chooser=d.getElementById("workbench-file");
  const file=new d.defaultView.File([JSON.stringify(reviewExample)],"hlj-review.json",{type:"application/json"});
  const transfer=new d.defaultView.DataTransfer();
  transfer.items.add(file);chooser.files=transfer.files;
  chooser.dispatchEvent(new d.defaultView.Event("change",{bubbles:true}));
  await new Promise(resolve=>setTimeout(resolve,420));
  ensure(!d.getElementById("workbench-preview").hidden,"Recognized review packet did not preview");
  ensure(d.getElementById("workbench-approve").disabled,"Approval must require explicit consent");
  d.getElementById("workbench-confirm").click();
  ensure(!d.getElementById("workbench-approve").disabled,"Consent did not unlock approval");
  d.getElementById("workbench-approve").click();
  ensure(d.getElementById("workbench-count").textContent==="1 / 8","Reviewed packet was not added");
  d.getElementById("workbench-clear").click();
  ensure(d.getElementById("workbench-count").textContent==="0 / 8","Clear failed to empty Workbench");

  // Constellation's original packet shape, built from the actual public catalog.
  const [topicsNow,linksNow,researchNow]=await Promise.all([
    d.defaultView.fetch("./data/topics.json").then(r=>r.json()),
    d.defaultView.fetch("./data/connections.json").then(r=>r.json()),
    d.defaultView.fetch("./data/research.json").then(r=>r.json())
  ]);
  const topic=topicsNow.topics.find(t=>t.id==="cymatics");
  const dossier=researchNow.dossiers.find(x=>x.topicId==="cymatics");
  const constellationPacket={
    schema:"369-hlj-research-packet/v1",generatedAt:"2026-11-09T23:00:00Z",
    topic:{id:topic.id,title:topic.title,realm:topic.realm,reviewStatus:topic.reviewStatus},
    scope:"Personal research notebook, not reviewed scientific findings",
    notes:[{topicId:"cymatics",text:"An original observation, not a measured scientific finding."},
           {topicId:"sacred-geometry",text:"Visual similarity needs independent investigation."}],
    relationships:linksNow.filter(c=>c.a==="cymatics"||c.b==="cymatics"),
    dossier:{classification:dossier.classification,question:dossier.question,
      supported:dossier.supported,boundary:dossier.boundary,sourceIds:dossier.sourceIds},
    sources:dossier.sourceIds.map(id=>researchNow.sources.find(s=>s.id===id)),
    privacy:"Exported locally in your browser; not uploaded by this application."
  };
  const noteFile=new d.defaultView.File([JSON.stringify(constellationPacket)],"constellation-notes.json",{type:"application/json"});
  const noteTransfer=new d.defaultView.DataTransfer();
  noteTransfer.items.add(noteFile);
  chooser.files=noteTransfer.files;
  chooser.dispatchEvent(new d.defaultView.Event("change",{bubbles:true}));
  await new Promise(resolve=>setTimeout(resolve,500));
  ensure(!d.getElementById("workbench-preview").hidden,"Constellation notebook did not preview");
  ensure(d.getElementById("workbench-approve").disabled,"Constellation approval bypassed consent");
  ensure(d.querySelectorAll("#workbench-preview-entries .workbench-details").length===3,
    "Constellation selected topic and two notes not all previewed");
  d.getElementById("workbench-confirm").click();
  d.getElementById("workbench-approve").click();
  ensure(d.getElementById("workbench-count").textContent==="1 / 8","Constellation packet not added after review");
  const linked=d.querySelector('#workbench-archive a[data-topic="sacred-geometry"]');
  ensure(!!linked,"Note topic deep link missing");
  linked.click();
  ensure(d.getElementById("cosmos-inspector-title").textContent==="Sacred Geometry",
    "Constellation selection did not follow linked topic");
  ensure(d.getElementById("workbench-count").textContent==="1 / 8",
    "Topic navigation discarded the session");

  // HLJ-013: Create a local project from exactly one approved Constellation packet.
  ensure(d.getElementById("research-projects")?.dataset.ready==="true","Project Workspace not initialized");
  const projInputs=[
    ["project-title","Patterns under boundary changes"],
    ["project-question","How might fixed boundaries alter the standing-wave pattern?"],
    ["project-hypothesis","Different boundaries should predict different nodal patterns."],
    ["project-limitations","Only theoretical statements and personal notebook text exist; experimental data is missing."]
  ];
  for(const [id,value] of projInputs)d.getElementById(id).value=value;
  const packetChoice=d.querySelector('#project-packet-choices input[name="project-packet"]');
  ensure(!!packetChoice,"Approved packet was not offered for project inclusion");
  packetChoice.click();
  d.getElementById("project-create").click();
  ensure(d.getElementById("project-count").textContent==="1 / 3",
    "Research project was not created from selected approved packet");
  ensure(d.querySelectorAll("#project-list .project-card").length===1,"Project library did not display created project");
  ensure(d.getElementById("project-list").textContent.includes("Patterns under boundary changes"),
    "Project question group was not retained");
  // Clearing the packet library does not silently destroy a separately created project snapshot.
  d.getElementById("workbench-clear").click();
  ensure(d.getElementById("workbench-count").textContent==="0 / 8","Workbench packet clear failed");
  ensure(d.getElementById("project-count").textContent==="1 / 3",
    "Clearing packets unexpectedly removed the independent project file");
  d.getElementById("project-clear").click();
  ensure(d.getElementById("project-count").textContent==="0 / 3","Project clear did not work");
  // Now import an actual schema-valid project using the same current-catalog adapters.
  const projectLib=await import("/research-project.mjs");
  const workbenchLib=await import("/research-workbench.mjs");
  const [verificationNow,auditNow,sourceCorrectionsNow,claimCorrectionsNow]=await Promise.all([
    d.defaultView.fetch("./data/verification.json").then(r=>r.json()),
    d.defaultView.fetch("./data/source-audit.json").then(r=>r.json()),
    d.defaultView.fetch("./data/source-corrections.json").then(r=>r.json()),
    d.defaultView.fetch("./data/corrections.json").then(r=>r.json())
  ]);
  const projectContext={
    topics:topicsNow,research:researchNow,connections:linksNow,verification:verificationNow,
    audit:auditNow,sourceCorrections:sourceCorrectionsNow,claimCorrections:claimCorrectionsNow
  };
  const normalizedPacket=workbenchLib.inspectWorkbenchInput(constellationPacket,projectContext);
  const at="2026-11-09T23:00:00Z";
  const projectFileData=projectLib.createResearchProject({
    focus:{title:"Cymatics learning journal",
      question:"Which visible resonant patterns correspond to controlled boundary changes?",
      hypothesis:"Boundary conditions should change the computed node locations.",
      limitations:"Only notebook comments and unreviewed dossier links are available, not measured experiments."},
    entries:normalizedPacket,createdAt:at,updatedAt:at
  },projectContext);
  const projectFile=new d.defaultView.File([JSON.stringify(projectFileData)],"project-import.json",{type:"application/json"});
  const projectTransfer=new d.defaultView.DataTransfer();
  projectTransfer.items.add(projectFile);
  const projectChooser=d.getElementById("project-file");
  projectChooser.files=projectTransfer.files;
  projectChooser.dispatchEvent(new d.defaultView.Event("change",{bubbles:true}));
  await new Promise(resolve=>setTimeout(resolve,480));
  ensure(!d.getElementById("project-import-preview").hidden,"Valid research project did not preview");
  ensure(d.getElementById("project-import-accept").disabled,
    "Project import approval bypassed explicit confirmation");
  ensure(d.querySelectorAll("#project-preview-records .project-review-detail").length===3,
    "Imported personal notes were not displayed for review");
  d.getElementById("project-import-confirm").click();
  ensure(!d.getElementById("project-import-accept").disabled,"Consent did not enable project approval");
  d.getElementById("project-import-accept").click();
  ensure(d.getElementById("project-count").textContent==="1 / 3","Approved imported project not added");
  d.querySelector("#project-list .project-remove").click();
  ensure(d.getElementById("project-count").textContent==="0 / 3","Project remove did not work");


  d.getElementById("institute-next").click();
  ensure(d.getElementById("institute-progress").textContent==="Stop 2 of 6","Visitor guide next-stop navigation failed");
  d.querySelector("#realms button").click();
  ensure(!d.getElementById("count").textContent.startsWith("179 /"),"Realm filter did not narrow browse count");
  finished=true;clearInterval(check);pass();
 }catch(e){finished=true;clearInterval(check);fail(e.message||String(e));}
},100);
</script></body></html>
